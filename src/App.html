<script>
/* ===== 엑셀 라이브러리(약 1.9MB)는 첫 화면을 막지 않게 나중에 불러옴 =====
   운영 화면은 화면을 그린 뒤 바로 뒤에서 받아 두고, 강사·학교 등은 몇 초 뒤 받아 둠.
   다 받기 전에 엑셀 버튼·파일 선택을 누르면 받은 다음 그 동작을 다시 실행 */
const XL_SRC = ['https:\/\/cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'https:\/\/cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'];
let XL_P = null;
const XL_OK = () => typeof XLSX !== 'undefined' && typeof ExcelJS !== 'undefined';
function loadXL() {
  if (XL_OK()) return Promise.resolve();
  if (XL_P) return XL_P;
  const one = src => new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.async = true; sc.onload = res; sc.onerror = () => rej(new Error('엑셀 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요')); document.head.appendChild(sc); });
  XL_P = Promise.all(XL_SRC.map(one)).catch(e => { XL_P = null; throw e; });
  return XL_P;
}
const XL_ACTS = new Set(['asstsms', 'devexport', 'edu-dl', 'export', 'export-tpl', 'extres', 'foundx', 'idbtpl', 'instsms', 'jxls', 'kitexport', 'kittpl', 'kqspec', 'kqxlsx', 'opsx', 'pcexport', 'pctpl', 'rmsend', 'rmsendsel', 'sexport', 'sopsx', 'st-xbase', 'st-xtpl', 'trtpl', 'ures', 'x-fmt', 'univres', 'rmprev']);
const XL_RE = /xls|export|tpl|sms|-dl$|spec/i;
window.addEventListener('click', e => {
  if (XL_OK()) return;
  const el = e.target.closest && e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act || ''; if (!XL_ACTS.has(a) && !XL_RE.test(a)) return;
  e.stopImmediatePropagation(); e.preventDefault();
  if (typeof toast === 'function') toast('엑셀 기능을 불러오는 중입니다…');
  loadXL().then(() => el.click()).catch(err => toast(err.message));
}, true);
window.addEventListener('change', e => {
  const t = e.target; if (XL_OK() || !t || t.type !== 'file' || !t.files || !t.files.length) return;
  e.stopImmediatePropagation();
  if (typeof toast === 'function') toast('엑셀 기능을 불러오는 중입니다…');
  loadXL().then(() => t.dispatchEvent(new Event('change', { bubbles: true }))).catch(err => toast(err.message));
}, true);
/* ===== 역할별 연결: 운영기관(admin) · 학교(school) · 강사(teacher) ===== */
let MODE = document.body.dataset.mode || 'teacher';
let TOKEN = document.body.dataset.token || '';
let ADMIN_KEY = document.body.dataset.key || '';
const ADMIN_LINK = document.body.dataset.link || '';
const ADM_SS = 'anc_adm';
const BIZ = document.body.dataset.biz || '';
const TITLES = { admin: '초등방과후 프로그램 운영 관리', school: '초등방과후 프로그램 운영 정보 확인', teacher: document.body.dataset.trole === 'asst' ? '초등방과후 프로그램 보조강사 수업 신청' : '초등방과후 프로그램 강사 수업 신청', join: '초등방과후 프로그램 기관 담당자 페이지' };
document.getElementById('brandTitle').textContent = TITLES[MODE];

function run(fn, ...args) {
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
}
const errMsg = e => { const m = (e && e.message) ? e.message.replace(/^Exception:\s*/, '') : String(e); return /is not a function/.test(m) ? '서버 코드가 이 화면보다 예전 버전입니다. Code.gs가 최신인지, 「배포 관리 → 연필 → 새 버전」으로 같은 배포에 올렸는지, 이 주소가 그 배포 주소인지 확인해 주세요.' : m; };
function setSave(t, bad) { const el = document.getElementById('saveState'); el.textContent = t; el.className = 'savestate' + (bad ? ' bad' : ''); }
function fatal(e) { const box = document.createElement('div'); box.className = 'notice bad'; box.style.marginTop = '24px'; box.textContent = '열 수 없습니다. ' + ((e && e.message) || String(e)); const app = document.getElementById('app'); app.innerHTML = ''; app.appendChild(box); }
function typing() { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }
function copyText(t) {
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('복사했습니다'); } catch (e) { toast('복사하지 못했습니다. 직접 선택해 복사해 주세요'); } ta.remove(); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('복사했습니다')).catch(fallback); else fallback();
}
function base(settings) {
  const d = defaultSettings(), s = settings || {};
  Object.keys(s).forEach(k => { if (s[k] != null) d[k] = s[k]; });
  return d;
}

/* ---------------- 운영기관 ---------------- */
let SAVED = null, saveTimer = null, saving = false, again = false;
function snap() {
  SAVED = { rows: {}, contacts: {}, inst: {}, set: {} };
  S.rows.forEach(r => SAVED.rows[r.id] = JSON.stringify(r));
  Object.entries(S.contacts || {}).forEach(([k, v]) => SAVED.contacts[k] = JSON.stringify(v));
  S.instructors.forEach(t => SAVED.inst[t.id] = JSON.stringify(t));
  SETTING_KEYS.forEach(k => SAVED.set[k] = JSON.stringify(S[k] ?? null));
}
function dirtyPayload() {
  if (!SAVED) return null;
  const p = { rows: [], deleteRows: [], contacts: {}, instructors: [], deleteInstructors: [], settings: {} };
  const ids = new Set();
  S.rows.forEach(r => { ids.add(r.id); if (SAVED.rows[r.id] !== JSON.stringify(r)) p.rows.push(r); });
  Object.keys(SAVED.rows).forEach(id => { if (!ids.has(id)) p.deleteRows.push(id); });
  Object.entries(S.contacts || {}).forEach(([k, v]) => { if (v && SAVED.contacts[k] !== JSON.stringify(v)) p.contacts[k] = v; });
  const tids = new Set();
  S.instructors.forEach(t => { tids.add(t.id); if (SAVED.inst[t.id] !== JSON.stringify(t)) p.instructors.push(t); });
  Object.keys(SAVED.inst).forEach(id => { if (!tids.has(id)) p.deleteInstructors.push(id); });
  SETTING_KEYS.forEach(k => { if (SAVED.set[k] !== JSON.stringify(S[k] ?? null)) p.settings[k] = S[k]; });
  if (S.ui.replaceRows) { p.replaceRows = true; p.rows = S.rows.slice(); p.deleteRows = []; p.resetContacts = !!S.ui.resetContacts; p.resetSkip = S.ui.resetSkip || []; if (p.resetContacts) { const kc = {}; p.resetSkip.forEach(n => { if (S.contacts[n]) kc[n] = S.contacts[n]; }); Object.keys(S.contacts).forEach(n => { if (S.contacts[n] && S.contacts[n].pre) kc[n] = S.contacts[n]; }); p.contacts = kc; } }
  if ((S.ui.resetNames || []).length) p.resetNames = S.ui.resetNames.slice();
  const n = (p.resetNames ? p.resetNames.length : 0) + p.rows.length + p.deleteRows.length + Object.keys(p.contacts).length + p.instructors.length + p.deleteInstructors.length + Object.keys(p.settings).length;
  return (n || p.replaceRows) ? p : null;
}
function adminPersist() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
function flush() {
  if (saving) { again = true; return; }
  if (!S.adminOrg && typeof fixPhonesAll === 'function') { try { fixPhonesAll(); if (typeof snapDatesAll === 'function') snapDatesAll(); } catch (e) {} }
  const p = dirtyPayload();
  if (!p) return;
  const sent = JSON.parse(JSON.stringify(p));
  saving = true; setSave('저장 중…');
  run('adminSave', ADMIN_KEY, p).then(res => {
    const strip = o => { const c = { ...o }; delete c.rev; return JSON.stringify(c); };
    sent.rows.forEach(r => {
      const rev = res.revs.rows[r.id]; if (!rev) return;
      const live = S.rows.find(x => x.id === r.id);
      if (live) { const same = strip(live) === strip(r); live.rev = rev; SAVED.rows[r.id] = same ? JSON.stringify(live) : JSON.stringify({ ...r, rev }); }
    });
    sent.deleteRows.forEach(id => delete SAVED.rows[id]);
    Object.keys(sent.contacts).forEach(k => {
      const rev = res.revs.contacts[k]; if (!rev) return;
      const live = S.contacts[k]; if (live) { const same = strip(live) === strip(sent.contacts[k]); live.rev = rev; SAVED.contacts[k] = same ? JSON.stringify(live) : JSON.stringify({ ...sent.contacts[k], rev }); }
    });
    sent.instructors.forEach(t => {
      const rev = res.revs.instructors[t.id]; if (!rev) return;
      const live = S.instructors.find(x => x.id === t.id);
      if (live) { const same = strip(live) === strip(t); live.rev = rev; SAVED.inst[t.id] = same ? JSON.stringify(live) : JSON.stringify({ ...t, rev }); }
    });
    sent.deleteInstructors.forEach(id => delete SAVED.inst[id]);
    Object.keys(sent.settings).forEach(k => SAVED.set[k] = JSON.stringify(sent.settings[k] ?? null));
    if (sent.resetNames) { S.ui.resetNames = (S.ui.resetNames || []).filter(n => sent.resetNames.indexOf(n) < 0); sent.resetNames.forEach(n => delete SAVED.contacts[n]); }
    if (sent.replaceRows) {
      S.ui.replaceRows = false;
      Object.keys(SAVED.rows).forEach(id => { if (!S.rows.some(r => r.id === id)) delete SAVED.rows[id]; });
      if (sent.resetContacts) { SAVED.contacts = {}; S.ui.resetContacts = false; }
    }
    let rerender = false;
    const C = res.conflicts || {};
    (C.rows || []).forEach(srv => { const i = S.rows.findIndex(x => x.id === srv.id); if (i >= 0) S.rows[i] = srv; SAVED.rows[srv.id] = JSON.stringify(srv); rerender = true; });
    (C.contacts || []).forEach(x => { S.contacts[x.school] = x.contact; SAVED.contacts[x.school] = JSON.stringify(x.contact); rerender = true; });
    (C.instructors || []).forEach(srv => { const i = S.instructors.findIndex(x => x.id === srv.id); if (i >= 0) S.instructors[i] = srv; SAVED.inst[srv.id] = JSON.stringify(srv); rerender = true; });
    if (rerender) toast('학교나 다른 담당자가 먼저 고친 내용이 있어 그 내용으로 새로 불러왔습니다. 확인 후 다시 고쳐 주세요');
    if (res.schoolLinks) { const before = JSON.stringify(S.schoolLinks); S.schoolLinks = res.schoolLinks; if (before !== JSON.stringify(S.schoolLinks)) rerender = true; }
    setSave('저장됨 · ' + now());
    saving = false;
    if (rerender && !typing()) render();
    if (again || dirtyPayload()) { again = false; adminPersist(); }
  }).catch(e => {
    saving = false; setSave('저장 실패 · 잠시 뒤 다시 저장합니다', true); toast(errMsg(e));
    if (/만료/.test(errMsg(e))) { if (ADMIN_LINK) adminAskLogin(() => adminPersist()); return; }
    setTimeout(adminPersist, 8000);
  });
}
function aUse(d, keepUi) {
  const ui = keepUi && S ? S.ui : { role: 'admin', view: 'board', st: '', q: '', region: '', probOnly: false, sel: '', showWait: false, onlyApps: false, condEdit: '' };
  const set = d.settings || {};

}
/* 웹 앱 운영자 링크(?a=)로 열었을 때: 비밀번호 확인 후 운영 화면 */
function adminStart() {
  if (ADMIN_KEY) { adminBoot(); return; }
  let saved = ''; try { saved = sessionStorage.getItem(ADM_SS) || ''; } catch (e) {}
  if (saved) { ADMIN_KEY = saved; adminBoot(); return; }
  adminAskLogin(adminBoot);
}
function adminAskLogin(after) {
  if (document.getElementById('admlogin')) return;
  /* 로그인 화면은 지난번 정보로 바로 띄우고, 서버 확인은 뒤에서 (달라졌으면 다시 그림) */
  let cg = null; try { cg = JSON.parse(localStorage.getItem('anc_gate') || 'null'); } catch (e) {}
  const show = g => showAdminLogin(g.pwSet, after, g.biz || []);
  if (cg && cg.pwSet && !ADMIN_LINK) show(cg);
  run('adminGate', ADMIN_LINK).then(g => {
    try { localStorage.setItem('anc_gate', JSON.stringify(g)); } catch (e) {}
    const el = document.getElementById('admlogin');
    if (!el) { if (!ADMIN_KEY) show(g); return; }
    if (JSON.stringify(g) === JSON.stringify(cg)) return;
    const pw = el.querySelector('#adm-pw'); if (pw && pw.value) return;
    el.remove(); show(g);
  }).catch(e => { if (!document.getElementById('admlogin')) fatal(e); });
}
function showAdminLogin(pwSet, after, bizL) {

    <label class="f">접속 구분<select id="adm-who">${pwSet || !master ? '' : ''}<option value="" ${master ? 'selected' : ''}>총괄 관리자 (모든 사업)</option>${bizL.map(x => `<option value="${x.k}" ${x.k === who ? 'selected' : ''}>${x.center} · ${x.name}</option>`).join('')}</select></label>
    ${master ? '' : (b && b.admins.length ? `<label class="f">관리자<select id="adm-name">${b.admins.map(n => `<option ${n === AN ? 'selected' : ''}>${n}</option>`).join('')}</select></label>` : '<div class="notice small">이 사업의 관리자 계정이 아직 없습니다. 총괄 관리자가 「기준정보 → 관리자 계정」에서 만들어 주세요.</div>')}

    <button class="btn pri" type="submit" ${!master && !(b && b.admins.length) ? 'disabled' : ''}>${master && !pwSet ? '비밀번호 정하고 들어가기' : '들어가기'}</button>

    const pw = box.querySelector('#adm-pw'), msg = box.querySelector('#adm-msg'), btn = box.querySelector('button');
